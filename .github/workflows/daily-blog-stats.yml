name: Daily Blog Stats Sync

on:
  schedule:
    # Runs at 2:00 AM daily
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Stats Sync API
        run: |
          curl -X POST \
            "${{ secrets.USER_URL }}/api/cron/sync-blog-stats" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail --show-error --silent
