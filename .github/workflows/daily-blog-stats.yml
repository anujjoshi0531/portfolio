name: Daily Blog Stats Sync

on:
  schedule:
    # Runs at 2:00 AM IST daily
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Stats Sync API
        run: |
          echo "Triggering blog stats sync..."

          # Using .netlify.app instead of .site to bypass Cloudflare Managed Challenges
          NETLIFY_URL="https://anujjoshi.netlify.app"
          
          response=$(curl -X POST \
            -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Referer: $NETLIFY_URL" \
            -H "Origin: $NETLIFY_URL" \
            -H "Cache-Control: no-cache" \
            -d '{}' \
            "$NETLIFY_URL/api/cron/sync-blog-stats" \
            --show-error \
            --silent \
            --max-time 30 \
            --write-out "HTTPSTATUS:%{http_code}")

          body=$(echo "$response" | sed -e 's/HTTPSTATUS\:.*//g')
          status=$(echo "$response" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Status: $status"
          echo "Response: $body"

          if [ "$status" -ne 200 ]; then
            echo "Stats sync failed"
            exit 1
          fi