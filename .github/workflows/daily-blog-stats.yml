name: Daily Blog Stats Sync

on:
  schedule:
    # Runs at 2:00 AM IST daily
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Stats Sync API
        run: |
          echo "Triggering blog stats sync..."

          # Reverting to USER_URL with Googlebot identity to bypass Cloudflare
          response=$(curl -X POST \
            -L \
            -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Referer: ${{ secrets.USER_URL }}" \
            -H "Origin: ${{ secrets.USER_URL }}" \
            -H "X-Forwarded-For: 127.0.0.1" \
            -d '{}' \
            "${{ secrets.USER_URL }}/api/cron/sync-blog-stats" \
            --show-error \
            --silent \
            --max-time 30 \
            --write-out "HTTPSTATUS:%{http_code}")

          body=$(echo "$response" | sed -e 's/HTTPSTATUS\:.*//g')
          status=$(echo "$response" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')

          echo "Status: $status"
          echo "Response: $body"

          if [ "$status" -ne 200 ]; then
            echo "Stats sync failed"
            exit 1
          fi