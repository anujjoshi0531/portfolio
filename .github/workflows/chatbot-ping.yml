name: Chatbot Backend Wakeup

on:
  schedule:
    # Runs at 2:00 AM IST daily (consistent with other cron jobs)
    - cron: '30 20 * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Chatbot Health Endpoint
        run: |
          node -e "
          async function ping() {
            const url = '${{ vars.CHATBOT_API_URL }}/health';
            const apiKey = '${{ secrets.CHATBOT_API_KEY }}';
            console.log('Pinging chatbot backend:', url);
            
            try {
              const response = await fetch(url, {
                method: 'GET',
                headers: {
                  'Authorization': 'Bearer ' + apiKey,
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
                }
              });
              
              console.log('Status Code:', response.status);
              const data = await response.text();
              console.log('Response:', data);
              
              if (!response.ok) {
                console.error('Ping failed with status:', response.status);
                process.exit(1);
              }
              console.log('Ping successful!');
            } catch (err) {
              console.error('Error during ping:', err.message);
              process.exit(1);
            }
          }
          ping();
          "
